---
# Python CircleCI 2.0 configuration file
#
# INFO: Check CircleCI documentation for more details
#       https://circleci.com/docs/2.0/language-python/

version: 2.1

executors:
  standard:
    parameters:
      python_version:
        type: string
        default: "3.14"
    docker:
      - image: cimg/python:<< parameters.python_version >>
        environment:
          TENTACLIO__CONN__S3_TEST: s3://public_key:private_key@tentaclio-bucket
          UV_PYTHON: << parameters.python_version >>
    working_directory: "~/lib"

# -----------------
# Reusable commands
# -----------------

commands:
  configure_github:
    steps:
      - run:
          name: Configure Github access
          command: |
            git config --global --unset url.ssh://git@github.com.insteadof;\
            echo https://${GITHUB_TOKEN}:@github.com > ~/.git-credentials
            git config --global credential.helper store

  checkout_source:
    steps:
      - restore_cache:
          keys:
            - source-{{ .Branch }}-{{ .Revision }}
            - source-{{ .Branch }}-
            - source-
      - checkout:
          method: full
      - save_cache:
          key: source-{{ .Branch }}-{{ .Revision }}
          paths:
            - "./.git"

  update_virtualenv:
    parameters:
      python_version:
        type: string
    steps:
      - restore_cache:
          keys:
            - virtualenv-<< parameters.python_version >>-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ checksum "uv.lock" }}
            - virtualenv-<< parameters.python_version >>-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-
            - virtualenv-<< parameters.python_version >>-{{ .Environment.CACHE_VERSION }}-
      - configure_github
      - run:
          name: Install Python packages
          command: make sync
      - save_cache:
          key: virtualenv-<< parameters.python_version >>-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ checksum "uv.lock" }}
          paths:
            - "./.venv"

jobs:
  lint:
    parameters:
      python_version:
        default: "3.14"
        type: string
    executor:
      name: standard
      python_version: << parameters.python_version >>
    steps:
      - checkout_source
      - update_virtualenv:
          python_version: << parameters.python_version >>
      - run:
          name: Run Python linter
          command: make lint

  unit:
    parameters:
      python_version:
        type: string
    executor:
      name: standard
      python_version: << parameters.python_version >>
    steps:
      - checkout_source
      - update_virtualenv:
          python_version: << parameters.python_version >>
      - run:
          name: Run Python unit tests
          command: make unit

  functional:
    parameters:
      python_version:
        type: string
    executor:
      name: standard
      python_version: << parameters.python_version >>
    steps:
      - checkout_source
      - update_virtualenv:
          python_version: << parameters.python_version >>
      - run:
          name: Run s3 functional tests
          command: make functional

workflows:
  version: 2

  test-build-deploy:
    jobs:
      - lint:
          filters:
            tags:
              only: /.*/
      - unit:
          name: unit-py<< matrix.python_version >>
          matrix:
            parameters:
              python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
          filters:
            tags:
              only: /.*/
      - functional:
          name: functional-py<< matrix.python_version >>
          matrix:
            parameters:
              python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
          filters:
            tags:
              only: /.*/
