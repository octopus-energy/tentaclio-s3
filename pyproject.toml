[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tentaclio-s3"
version = "0.0.3"
description = "A python project containing all the dependencies for schema s3 for tentaclio."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Octopus Energy", email = "nerds@octopus.energy"}
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "tentaclio>=1.3.6",
    "boto3>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "black",
    "flake8",
    "Flake8-pyproject",
    "isort>=5.11.2",
    "mypy",
    "twine",
    "moto[s3]>=5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*tentaclio_s3*"]

[tool.black]
line-length = 99
target_version = ['py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
exclude = '(\.mypy_cache)'

[tool.flake8]
exclude = ["logs", ".*/*.py", "*.egg-info"]
max-line-length = 99
max-complexity = 10
ignore = ["F405","W391","W503"]

[tool.isort]
line_length = 99
multi_line_output = 3
lines_after_imports = 2
include_trailing_comma = "True"
default_section = "THIRDPARTY"
known_first_party = "tentaclio-s3"
sections = "STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"

[tool.mypy]
incremental = "True"
warn_unused_configs = "True"
warn_unused_ignores = "True"
check_untyped_defs = "True"
warn_redundant_casts = "True"
ignore_missing_imports = "True"
